<!--
  DIE ABAS-BILDMARKE OHNE SCHRIFTZUG.

  Abgeleitet aus abas-logo.svg (Original mit Wortmarke, bitte dort lassen):
  die Textgruppe ist entfernt, die drei Formen sind UNVERAENDERT uebernommen -
  keine Koordinate angefasst, nur der Ausschnitt (viewBox) auf die Marke
  gesetzt. So bleibt sie deckungsgleich mit dem Original, falls das je
  ersetzt wird.

  Fuer den "in ABAS oeffnen"-Knopf der Artikelmappe. Die Marke traegt die
  Hausfarben von abas und behaelt sie - deshalb steht sie im Knopf auf
  hellem Grund: das Dunkelblau (#112033) waere auf unserer dunklen
  Oberflaeche sonst unsichtbar.
-->
