server:
  port: 6969

spring:
  application:
    name: gebieter

  # Die Begründung einer Ablehnung (ResponseStatusException) geht als message mit, sonst sähe der Client nur „Bad Request“.
  # Seit Spring Boot 4 heißt die Eigenschaft spring.web.error.*, das alte server.error.* wirkt nicht mehr (2026-10-13).
  web:
    error:
      include-message: always

  # Lokale Werte aus der .env im Repo-Root (nicht in Git, Vorlage: env.beispiel).
  # Zwei Pfade, damit es aus dem Repo-Root und aus spring/ heraus funktioniert.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${postgres_url}:${postgres_port}/${postgres_db_name}
    username: ${postgres_user}
    password: ${postgres_pw}

  # Hibernate legt die Tabellen aus den Entities an und erweitert sie (löscht aber nichts).
  # Wegen loser Kopplung gibt es keine Beziehungen zwischen Entities, daher entstehen keine FK-Constraints.
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Uploads bis 100 GB. Sie werden gestreamt und liegen nie ganz im Arbeitsspeicher: Spring legt sie als Temp-Datei
  # auf die Platte (file-size-threshold bleibt 0), der SftpService reicht sie als Strom weiter.
  servlet:
    multipart:
      max-file-size: 100GB
      max-request-size: 100GB

  # Gestreamte Antworten (StreamingResponseBody) laufen asynchron: der Export und der Import der Sternzeiten, die ihren
  # Fortschritt zeilenweise melden (2026-10-13). Ohne diese Zeile gilt der Standard des Containers von 30 Sekunden, ein
  # Import über Millionen Zeilen bräche mitten im Lauf ab. -1 heißt keine Frist: fertig ist, wenn der Lauf fertig ist.
  mvc:
    async:
      request-timeout: -1

# Laufzeiten und Grenzen des Logins
app1:
  login:
    # so lange gilt eine 2FA-Wartezeile (Aktivierungslink)
    two-factor-validity: 10m
    # die Seite hinter dem Aktivierungslink in der 2FA-Mail. Der Bestätigungs-Token hängt hinter einem # dahinter, den
    # Teil schickt ein Browser nie an einen Server. Beim Entwickeln der Vite-Server, später die öffentliche Adresse.
    confirm-url: ${frontend_url}/login/confirm
    # so viele Sitzungen (Geräte) darf ein User gleichzeitig haben
    max-sessions: 3
  refresh:
    # so lange gilt ein Refresh-Token, jede Erneuerung beginnt von vorn
    validity: 14d
  jwt:
    # so lange gilt ein JWT, danach holt das Frontend per Refresh ein neues
    validity: 30m
  cookie:
    # Secure-Flag der Cookies. Chrome erlaubt Secure-Cookies auch auf http://localhost
    secure: true

  # Der System-User (system/security/SystemUsersSecurityContextService): Als er laufen Jobs ohne Token, zuerst der
  # ABAS-Worker, der nach dem Holen in die Kerne schreibt. Eigene Zeile in users, Service-Account, ohne Zugangsdaten;
  # was er darf, sagen seine AR in der Datenbank. Die guid ist fest (User 2026-10-13).
  system-users:
    guid: 99999999-9999-9999-9999-999999999999

  # Solr (solr/client). Die URL endet vor dem Kernnamen, je Kern hängt der Client seinen key an. User und Passwort
  # gelten für den Container (Basic Auth aus der security.json) und das Backend zugleich, siehe docs/backend/solr.md.
  solr:
    url: http://${solr_host}:${solr_port}/solr
    user: ${solr_user}
    pw: ${solr_pw}
    # Auflösen (solr/dms): Treffer je Seite und Treffer insgesamt, darüber liefert eine Seite nichts mehr
    resolve:
      page-size: 50
      max-results: 2000
    # Suche (solr/dms): nur die besten Treffer, keine Seiten
    search:
      hits: 30
    # Kern ARTIKEL (solr/artikel), die aufaggregierten Referenzen je Flag (User 2026-10-13): bis zu wie vielen
    # Alternativschritten die Mappe suchen darf, und höchstens wie viele Treffer je Flag abgelegt werden; darüber
    # gilt das Ergebnis als gekürzt
    artikel:
      references:
        max-depth: 5
        max-rows: 500

  # ABAS-ERP (Paket abas). Alles aus der .env, der Server steht nur im LAN oder VPN. Leer heißt: kein Zugriff auf ABAS,
  # das Backend startet trotzdem, jede Anfrage an ABAS wird 503.
  abas:
    host: ${abas_host:}
    port: ${abas_port:4443}
    mandant: ${abas_mandant:}
    # der Pfad zwischen Port und /r/<mandant>, bei ABAS die Middleware
    base-path: ${abas_base_path:mw}
    # mit diesem Benutzer fragen wir bei ABAS an (Basic Auth)
    user: ${abas_user:_abas_}
    pw: ${abas_pw:}
    # das Zertifikat des ABAS-Servers als PEM: gesetzt wird nur genau diesem vertraut, wie beim Host-Key des SFTP. Leer:
    # der Truststore des JDK.
    cert-path: ${abas_cert_path:}
    # Verbindungsaufbau, im LAN Millisekunden
    connect-timeout: 10s
    # so lange darf eine einzelne Antwort ausbleiben, ein großes Objekt mit tausend Tabellenzeilen braucht Sekunden
    request-timeout: 120s
    # der Worker-Pool (AbasSternzeitFetchWorkerPool), der die Queue abarbeitet
    fetch:
      # so viele Sternzeiten holt der Pool gleichzeitig bei ABAS; eine Abfrage dauert rund eine Sekunde
      parallel: 20
      # der Takt des Watchers: alte Claims freigeben, den Pool wecken, wenn etwas anliegt
      watch-interval: 5s
      # ein Claim, der so lange steht, gehört einem abgestürzten Worker und wird freigegeben
      claim-timeout: 5m
      # ab so vielen Fehlversuchen bleibt ein Eintrag mit seinem Fehler liegen und wird nicht mehr gezogen
      max-attempts: 10
      # true: nach dem Start erst auf Knopfdruck holen, z. B. vor einem Massenimport
      start-paused: false

  # Microsoft Graph (Paket graph), siehe docs/backend/graph.md. Alles aus der .env, die Schlüsseldateien liegen
  # außerhalb des Repos in app1/secrets/entra. Leer heißt: kein Zugriff auf Graph, das Backend startet trotzdem.
  graph:
    # die Identität des Backends gegenüber Entra: App-only mit Zertifikat statt Client-Secret (graph/entra)
    entra:
      tenant-id: ${entra_tenant_id:}
      client-id: ${entra_client_id:}
      private-key-path: ${entra_private_key_path:}
      certificate-path: ${entra_certificate_path:}
      # so lange darf der Token-Abruf dauern, danach 503
      request-timeout: 10s
    # der Mailversand (graph/mail): Vorlagen pflegt der Admin im GraphManager
    mail:
      # das Postfach, in dessen Namen das System selbst verschickt, z. B. die 2FA-Mail
      system-sender-address: ${graph_mail_sender:}
      # so lange darf ein Aufruf von Graph dauern, danach 503
      request-timeout: 10s

  # Dateispeicher per SFTP (system/sftp). Alles, was den Server betrifft, kommt aus der .env: Für den Wechsel auf ein
  # NAS ändern sich nur sftp_host und sftp_host_key. Der Server muss dem User denselben root-dir zeigen.
  sftp:
    host: ${sftp_host}
    port: ${sftp_port}
    user: ${sftp_user}
    pw: ${sftp_pw}
    # öffentlicher Host-Key des Servers, Typ und Schlüssel: nur genau dieser Server wird akzeptiert
    host-key: ${sftp_host_key}
    # gesetzt: Anmeldung mit diesem privaten Schlüssel statt mit dem Passwort
    private-key-path: ${sftp_private_key_path:}
    # Wurzel aus Sicht des SFTP-Users. Im Container ist das sein chroot-Ordner (Compose: sftproot).
    root-dir: /sftproot
    # so viele Verbindungen dürfen insgesamt gleichzeitig ausgeliehen sein
    max-connections: 12
    # so viele davon ein einzelner User: Wer zwanzig Dateien auf einmal hochlädt, blockiert nicht alle anderen
    max-connections-per-user: 2
    # so viele Verbindungen hält der Pool offen, damit die erste Übertragung nicht auf den Handschlag wartet
    min-idle-connections: 1
    # Verbindungsaufbau und Anmeldung
    connect-timeout: 15s
    # so lange darf eine einzelne Antwort des Servers ausbleiben
    socket-timeout: 10m
    # so lange wartet ein Aufrufer auf einen freien Platz, dann bekommt er eine Absage
    borrow-timeout: 30s
    # unbenutzte Verbindungen über min-idle-connections hinaus werden nach dieser Zeit geschlossen
    idle-timeout: 10m
    # Ablage JJJJ/MM/TT[_n]/<sha256>.bin: ab so vielen Dateien am Tag wird ein weiterer Ordner _n aufgemacht
    max-files-per-directory: 10000
