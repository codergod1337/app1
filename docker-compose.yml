# Docker-Logs: zusammen maximal 500 MB. Docker kann nur pro Container begrenzen,
# daher bei jedem neuen Container max-size so anpassen, dass die Summe 500 MB bleibt.
# Aktuell 2 Container: 2 x 5 x 50 MB = 500 MB.
# Gilt erst für neu angelegte Container: "docker compose up -d", nicht "docker restart".
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  app1_postgres:
    image: postgres:18.6
    container_name: app1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${postgres_db_name}
      POSTGRES_USER: ${postgres_user}
      POSTGRES_PASSWORD: ${postgres_pw}
    ports:
      - "${postgres_port}:5432"
    # Daten liegen außerhalb von Git: app1/docker_mounts/postgres
    volumes:
      - ../docker_mounts/postgres:/var/lib/postgresql
    logging: *logging

  # Dateispeicher. Das Backend spricht ihn über system/sftp an, mit User und Passwort aus derselben .env.
  # Später kann ein NAS an seine Stelle treten: dann ändern sich in der .env nur sftp_host und sftp_host_key.
  # atmoz/sftp gibt es auf Docker Hub nur für amd64, der Pi ist arm64. Deshalb wird das Image aus dem Git-Repo des
  # Projekts gebaut: Alpine plus OpenSSH, fester Commit (der letzte, 2024-09-14; Versions-Tags gibt es keine).
  # "docker compose up -d" baut es beim ersten Mal, app1-deploy.sh bei jedem Deploy ohne Cache neu.
  app1_sftp:
    build:
      context: https://github.com/atmoz/sftp.git#46a8b3db48a99257249a79fcbdf1cd9f666e161b
      dockerfile: Dockerfile-alpine
    image: app1_sftp
    container_name: app1_sftp
    restart: unless-stopped
    environment:
      # user:passwort:uid:gid:ordner. Der User wird in sein Home gesperrt (chroot), der Ordner darin heißt
      # sftproot und ist aus seiner Sicht /sftproot: genau der root-dir in der application.yml.
      SFTP_USERS: "${sftp_user}:${sftp_pw}:1001:100:sftproot"
    ports:
      - "${sftp_port}:22"
    # Alles zum Container liegt außerhalb von Git in app1/docker_mounts/sftp: der Host-Key direkt darin, die Dateien
    # im Unterordner sftproot. Der Key liegt bewusst nicht im gemounteten Ordner, sonst sähe ihn der SFTP-User.
    volumes:
      - ../docker_mounts/sftp/sftproot:/home/${sftp_user}/sftproot
      # Fester Host-Key (chmod 600), damit er jedes "up" überlebt: Das Backend akzeptiert nur genau diesen Server.
      - ../docker_mounts/sftp/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
    logging: *logging
